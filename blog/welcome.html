<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog</title>

    <link rel="stylesheet" href="../writing/writing.css">
</head>

<body>

<header>

    <div class="page-heading">
        <h1>Blog</h1>
        <a class="support-link" href="../support/">Support</a>
    </div>

    <nav>
        <a href="../landing/">Formal Announcements Page</a>
    </nav>

    <hr>

    <nav>
        <a href="../">Home</a>
        |
        <span>Special Interests:</span>
        <a href="../music/">Music</a>
        <a class="current-page">Blog</a>
        <a href="../writing/">Writing</a>
        <a href="../visual art/">Visual Art</a>
        <span class="future-interests">
            <a href="#">Politics</a>
            <a href="#">Linguistics</a>
            <a href="#">Philosophy</a>
            <a href="#">Theology</a>
        </span>
    </nav>

    <hr>

</header>

<main>

    <div class="writing-intro">
        <p>
            A home for blog posts, notes, and whatever wants to become a piece of writing.
        </p>
    </div>

    <section class="blog-feed" id="blog-posts-section" aria-labelledby="blog-posts-heading">
        <h2 id="blog-posts-heading">Blog</h2>
        <div id="blog-posts"></div>
    </section>

</main>

<footer>

    <hr>

    <p>
        <a href="../landing/">Formal Announcements Page</a>
        |
        <a href="../">Back to Home</a>
    </p>

</footer>

<script>
    const entries = [
        "entries/2026-09-10-welcome.txt",
        "entries/2026-09-29-do-androids-dream-of-electric-sheep.txt"
    ];

    const feed = document.getElementById("blog-posts");

    function parseTextPost(rawText) {
        const lines = rawText.split(/\r?\n/);
        let title = "Untitled";
        let posted = "";
        let contentLines = [];
        let inBody = false;

        for (const line of lines) {
            if (!inBody) {
                const trimmedLine = line.trim();
                if (trimmedLine === "") {
                    continue;
                }
                if (trimmedLine.startsWith("Title:")) {
                    title = trimmedLine.replace(/^Title:\s*/, "").trim();
                    continue;
                }
                if (trimmedLine.startsWith("Posted:")) {
                    posted = trimmedLine.replace(/^Posted:\s*/, "").trim();
                    continue;
                }
                inBody = true;
            }

            contentLines.push(line);
        }

        return {
            title,
            posted,
            content: contentLines.join("\n").trim()
        };
    }

    function excerptText(text, limit = 180) {
        const clean = text.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\s+/g, " ").trim();
        if (clean.length <= limit) {
            return clean;
        }
        return clean.slice(0, limit).trimEnd() + "...";
    }

    function postedDateValue(posted) {
        const match = posted.match(/^([A-Za-z]+) (\d{1,2}), (\d{4}) at (\d{1,2}):(\d{2}) (AM|PM)/);
        const month = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(match?.[1]);
        if (month < 0) {
            return 0;
        }

        const hour = Number(match[4]) % 12 + (match[6] === "PM" ? 12 : 0);
        return Date.UTC(Number(match[3]), month, Number(match[2]), hour, Number(match[5]));
    }

    Promise.all(entries.map(async (entryPath) => {
        const response = await fetch(entryPath);
        if (!response.ok) {
            throw new Error(`Could not load ${entryPath}`);
        }
        return { path: entryPath, ...parseTextPost(await response.text()) };
    }))
    .then((posts) => {
        posts.sort((firstPost, secondPost) => postedDateValue(secondPost.posted) - postedDateValue(firstPost.posted));
        posts.forEach(({ path, title, posted, content }) => {
            const article = document.createElement("article");
            article.className = "blog-entry";

            article.innerHTML = `
                <header class="blog-entry-header">
                    <h3>${title}</h3>
                    <p class="blog-entry-meta">Posted <time>${posted}</time></p>
                </header>
                <div class="blog-entry-content">
                    <p>${excerptText(content)}</p>
                    <p><a href="${path}">View full entry →</a></p>
                </div>
            `;

            feed.appendChild(article);
        });
    })
    .catch((error) => {
        feed.innerHTML = '<article class="writing-entry"><p class="entry-label">Blog</p><p>Unable to load blog entries right now.</p></article>';
        console.error(error);
    });
</script>

</body>
</html>
