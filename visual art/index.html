		</p>

		<div class="art-grid">

			<figure class="art-piece">

				<img src="Best CSAcad Work/cs-academy-canvas (15) copy.png" alt="Cyan geometric columns with pink highlights" loading="lazy">

			</figure>

		<div class="art-grid">
